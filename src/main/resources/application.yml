spring:
  application:
    name: moyeorock

  datasource:
    url: jdbc:mysql://localhost:3306/moyeorock?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      fail-on-empty-beans: false

jwt:
  secret-key: ${JWT_SECRET_KEY}
  issuer: ${JWT_ISSUER}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY}

# file.storage.type을 안 정하면 local이 기본값이다(FileStorageClient 구현체들의
# @ConditionalOnProperty matchIfMissing=true). S3로 전환할 땐 FILE_STORAGE_TYPE=s3 +
# file.storage.s3.bucket/region을 추가로 설정한다 — 코드 변경은 필요 없다.
file:
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    local:
      base-path: ${FILE_LOCAL_BASE_PATH:./uploads}
      base-url: ${FILE_LOCAL_BASE_URL:http://localhost:8080}
      upload-url-expiry-seconds: 600

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  pattern:
    level: "%5p [%X{requestId:-}][%X{userId:-}]"
  level:
    com.moyeorock: debug
    org.hibernate.SQL: debug