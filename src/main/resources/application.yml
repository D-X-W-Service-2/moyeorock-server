spring:
  application:
    name: moyeorock

  datasource:
    url: jdbc:mysql://localhost:3306/moyeorock?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 페이징 size 상한. 사용자 검색 무한 스크롤 기준 20 (2026-09-28 결정). 전역이라 모든 팀 목록 API에 적용된다.
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      fail-on-empty-beans: false

jwt:
  secret-key: ${JWT_SECRET_KEY}
  issuer: ${JWT_ISSUER}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me

# file.storage.type을 안 정하면 local이 기본값이다(FileStorageClient 구현체들의
# @ConditionalOnProperty matchIfMissing=true). S3로 전환할 땐 FILE_STORAGE_TYPE=s3 +
# file.storage.s3.bucket/region/upload-url-expiry-seconds를 설정한다. upload-url-expiry-seconds를
# 빠뜨리면 0으로 바인딩돼 발급한 URL이 바로 만료된다. 프론트는 업로드 PUT에서 Authorization 헤더를
# 빼야 한다(docs/specs/api-spec.md §10 file "업로드 PUT 규칙").
file:
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    local:
      base-path: ${FILE_LOCAL_BASE_PATH:./uploads}
      base-url: ${FILE_LOCAL_BASE_URL:http://localhost:8080}
      upload-url-expiry-seconds: 600

# AI 서버 같은 내부 서버가 부르는 /v1/internal/**의 인증 키(X-Internal-Api-Key 헤더, 이슈 #147). 값이 없거나 32바이트보다
# 짧으면 내부 API를 모두 거절한다 — 배포 환경에 INTERNAL_API_KEY를 넣고 같은 값을 AI 팀에 GitHub 밖에서 전달한다.
internal:
  api-key: ${INTERNAL_API_KEY:}

# 문서(/v3/api-docs, /swagger-ui.html)는 SWAGGER_ENABLED=true일 때만 열린다. 값이 없으면 닫힌다 — 운영 배포에서
# 설정을 빠뜨려도 API 문서가 노출되지 않게 하려는 것이다(PR #114 리뷰). 로컬·개발은 .env에 SWAGGER_ENABLED=true를 둔다.
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# 배포 스크립트(.github/workflows/deploy-dev.yml)가 재시작 뒤 /actuator/health로 성공을 판단한다. DB 연결까지 보고
# UP/DOWN만 답한다. health 말고는 열지 않고, 컴포넌트별 상세는 밖에 보이지 않게 둔다(둘 다 기본값이지만 명시).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# 브라우저에서 API를 부를 수 있는 프론트 주소(쉼표 구분, #123). 기본값은 로컬 개발 + 프론트 시험 배포(moyeorock.kro.kr,
# Cloudflare Pages) + 백엔드 점검용 배포(vercel). 운영 배포는 CORS_ALLOWED_ORIGINS로 목록 전체를 바꾼다.
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:*,https://moyeorock.kro.kr,https://moyeorak.pages.dev,https://moyeorock-client-test-alpha.vercel.app}"

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  pattern:
    level: "%5p [%X{requestId:-}][%X{userId:-}]"
  level:
    com.moyeorock: debug
    org.hibernate.SQL: debug