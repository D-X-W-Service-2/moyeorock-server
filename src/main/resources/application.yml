spring:
  application:
    name: moyeorock

  datasource:
    url: jdbc:mysql://localhost:3306/moyeorock?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      fail-on-empty-beans: false

file:
  presigned-url-expiration-minutes: 10
  s3:
    # 버킷 이름·CDN 도메인은 팀 결정 대기(이슈 #18) — 비어 있으면 부팅은 되고 발급 요청 시 에러
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    public-base-url: ${FILE_PUBLIC_BASE_URL:}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  issuer: ${JWT_ISSUER}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    com.moyeorock: debug
    org.hibernate.SQL: debug