# 테스트 전용 설정 — datasource는 Testcontainers MySQL이 @ServiceConnection으로 자동 주입한다.
# ddl-auto를 validate로 두고 Flyway 마이그레이션을 그대로 태워서 실제 MySQL 스키마와 정합성까지 검증한다
# (docs/conventions/flyway-migration.md 참고). 이 파일이 main의 application.yml을 통째로 대체하므로
# jwt 섹션이 없으면 JwtProvider 생성자(secretKey().getBytes())가 NPE로 컨텍스트 로드에 실패한다.
spring:
  application:
    name: moyeorock

  # 페이징 size 상한. 사용자 검색 무한 스크롤 기준 20 (2026-09-28 결정). 전역이라 모든 팀 목록 API에 적용된다.
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      fail-on-empty-beans: false

jwt:
  secret-key: test-only-secret-key-must-be-at-least-32-bytes-long
  issuer: moyeorock-test
  access-token-expiry: 3600000

# 카카오 더미 값 — KakaoProperties 바인딩용. 실제 호출은 테스트에서 전부 스텁/모킹한다.
kakao:
  client-id: test-kakao-client-id
  client-secret: ""
  redirect-uri: http://localhost:3000/login/oauth2/code/kakao
  token-uri: http://localhost/kakao/oauth/token
  user-info-uri: http://localhost/kakao/v2/user/me
