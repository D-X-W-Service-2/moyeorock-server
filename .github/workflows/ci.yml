name: CI

on:
  pull_request:
    branches: [main]

# 같은 PR에 push가 연달아 오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # cache: gradle — Gradle 의존성 캐시. gradle/actions/setup-gradle@v6은 캐시 컴포넌트 이용약관 동의가 필요해 쓰지 않는다
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # git-convention §3-5 CI 필수 체크. 지금은 check가 test만 돈다.
      # Testcontainers가 MySQL을 띄운다(러너에 Docker 기본 설치). 테스트 값은 src/test/resources/application.yml에 있어 Secret이 필요 없다
      - name: Check
        run: ./gradlew check

      # 실패하면 Actions 화면에서 테스트 리포트를 내려받을 수 있게 올린다
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
